name: Release

on:
  schedule:
    # 16:00 UTC = 00:00 Asia/Shanghai (China has no DST)
    - cron: "0 16 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish the current main commit"
        required: false
        default: false
        type: boolean
      update_dependencies:
        description: "Open a PR when bundled dependencies changed"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  publish:
    if: >
      (github.event_name == 'push' &&
       github.actor != 'github-actions[bot]' &&
       !startsWith(github.event.head_commit.message, 'chore(release):')) ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.force_publish == true || inputs.force_publish == 'true'))
    # Job permissions replace the workflow grant. id-token: write is what
    # lets this job mint the OIDC JWT npm Trusted Publisher expects.
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Do not set registry-url. setup-node would write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and export a
      # placeholder NODE_AUTH_TOKEN. npm then treats that as classic auth,
      # skips the OIDC exchange, and the registry answers 404.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure modern npm (Trusted Publisher requires >= 11.5.1)
        run: |
          set -euo pipefail
          npm install -g npm@latest
          NPM_VERSION="$(npm --version)"
          echo "npm ${NPM_VERSION}"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`Trusted publishing requires npm >= 11.5.1, found ${process.argv[1]}`);
              process.exit(1);
            }
          ' "$NPM_VERSION"

      - name: Fetch GitHub dependencies over HTTPS
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install current dependencies
        run: npm ci --allow-git=all

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Commit and tag stay on the runner until publish succeeds. The push
      # step below is skipped when this job fails, so a rejected publish
      # cannot leave main or the tag set pointing at an unpublished version.
      - name: Ensure unpublished version, commit, and tag
        id: version
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          CURRENT="$(node -p "require('./package.json').version")"
          CREATED_COMMIT=false
          CREATED_TAG=false

          if npm view "${PACKAGE_NAME}@${CURRENT}" version >/dev/null 2>&1; then
            echo "Version ${CURRENT} already on npm; bumping patch."
            npm version patch --no-git-tag-version
          else
            echo "Version ${CURRENT} is not on npm; will publish as-is."
          fi

          VERSION="$(node -p "require('./package.json').version")"

          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): ${VERSION}"
            CREATED_COMMIT=true
            echo "Created release commit for ${VERSION}."
          else
            echo "No file changes to commit (version already set in tree)."
          fi

          RELEASE_COMMIT="$(git rev-parse HEAD)"
          TAG="v${VERSION}"

          BASE_REF=""
          if BASE_REF="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${RELEASE_COMMIT}^" 2>/dev/null)"; then
            echo "Using previous version tag ${BASE_REF} as the release base."
          else
            BASE_REF="$(git log --format='%H' --grep='^chore(release):' -n 1 "${RELEASE_COMMIT}^" 2>/dev/null || true)"
            if [ -n "$BASE_REF" ]; then
              echo "No previous version tag found; using release commit ${BASE_REF} as the base."
            else
              echo "No previous version tag or release commit found; notes will cover repository history."
            fi
          fi

          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            EXISTING_TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
            if [ "$EXISTING_TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "Tag ${TAG} already points to ${EXISTING_TAG_COMMIT}, expected ${RELEASE_COMMIT}." >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists on the release commit."
          else
            git tag --annotate "$TAG" --message "Release ${TAG}" "$RELEASE_COMMIT"
            CREATED_TAG=true
            echo "Created annotated tag ${TAG}."
          fi

          {
            echo "VERSION=${VERSION}"
            echo "TAG=${TAG}"
            echo "RELEASE_COMMIT=${RELEASE_COMMIT}"
            echo "BASE_REF=${BASE_REF}"
          } >> "$GITHUB_ENV"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "base_ref=${BASE_REF}"
            echo "release_commit=${RELEASE_COMMIT}"
            echo "created_commit=${CREATED_COMMIT}"
            echo "created_tag=${CREATED_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to npm (OIDC Trusted Publisher)
        run: |
          set -euo pipefail
          # A set NODE_AUTH_TOKEN — even empty or the setup-node placeholder —
          # wins over OIDC. Drop it, and drop any user npmrc auth line that
          # would expand to that token.
          unset NODE_AUTH_TOKEN || true
          strip_auth() {
            local file="$1"
            if [ -n "$file" ] && [ -f "$file" ]; then
              grep -v '_authToken' "$file" > "${file}.noidc" || true
              mv "${file}.noidc" "$file"
            fi
          }
          strip_auth "${NPM_CONFIG_USERCONFIG:-}"
          strip_auth "${HOME}/.npmrc"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC token request env is missing. This job needs permissions: id-token: write." >&2
            exit 1
          fi
          npm publish --access public

      - name: Push commit and/or tags
        env:
          CREATED_COMMIT: ${{ steps.version.outputs.created_commit }}
          CREATED_TAG: ${{ steps.version.outputs.created_tag }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          if [ "$CREATED_COMMIT" = "true" ] && [ "$CREATED_TAG" = "true" ]; then
            echo "Pushing release commit and ${TAG} atomically."
            git push --atomic origin "HEAD:${BRANCH}" "refs/tags/${TAG}"
          elif [ "$CREATED_COMMIT" = "true" ]; then
            echo "Pushing release commit to ${BRANCH}."
            git push origin "HEAD:${BRANCH}"
          elif [ "$CREATED_TAG" = "true" ]; then
            echo "Pushing ${TAG}."
            git push origin "refs/tags/${TAG}"
          else
            echo "Nothing new to push (commit/tag already on remote)."
          fi

      - name: Generate release notes
        id: release-notes
        env:
          BASE_REF: ${{ steps.version.outputs.base_ref }}
          RELEASE_COMMIT: ${{ steps.version.outputs.release_commit }}
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${TAG}.md"
          node .github/scripts/generate-release-notes.mjs \
            --base-ref "$BASE_REF" \
            --head-ref "$RELEASE_COMMIT" \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$NOTES_FILE"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "Generated release notes at ${NOTES_FILE}."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.release-notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; skipping duplicate creation."
          else
            echo "Creating GitHub Release ${TAG}."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          fi

  update-dependencies:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.update_dependencies == true || inputs.update_dependencies == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure modern npm (Trusted Publisher requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Fetch GitHub dependencies over HTTPS
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install current dependencies
        run: npm ci --allow-git=all

      - name: Apply registry and git dependency updates
        run: |
          set -euo pipefail
          npx npm-check-updates -u
          npm install --allow-git=all

          SPECS_FILE="$(mktemp)"
          node .github/scripts/git-dependency-updates.mjs > "$SPECS_FILE"
          if [ -s "$SPECS_FILE" ]; then
            echo "Refreshing floating GitHub dependencies:"
            cat "$SPECS_FILE"
            xargs npm install --allow-git=all < "$SPECS_FILE"
          else
            echo "Floating GitHub dependencies already match their remote refs."
          fi

      - name: Open or update dependency pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="chore/dependency-updates"

          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): refresh bundled Pi packages"

          git fetch origin "$BRANCH" || true
          if git rev-parse --verify --quiet "origin/${BRANCH}" >/dev/null; then
            git push --force-with-lease="refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" \
              origin "HEAD:${BRANCH}"
          else
            git push origin "HEAD:${BRANCH}"
          fi

          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Updated pull request #${EXISTING}."
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<'EOF'
          定时检查发现 bundled 依赖有变化。请审阅后合并。

          合并进 `main` 后，现有的 push 发版流程会发布新版本。这个任务不会直接推 `main`，也不会自己发版。

          - registry 依赖：`npm-check-updates` 升级 `package.json` 范围，并刷新 lock
          - `github:owner/repo#branch`：lock 里的 commit 刷到该分支当前提交；`package.json` 仍指向分支
          EOF

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "chore(deps): refresh bundled Pi packages" \
            --body-file "$BODY_FILE"
